name: monitor-tick
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /admin/tick
        env:
          TICK_TOKEN: ${{ secrets.TICK_TOKEN }}
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TICK_TOKEN" \
            --max-time 240 https://crawlwise-data.netlify.app/admin/tick)
          echo "HTTP $code"
          jq -c '{ok, checked: (.checked // .results | length? // null), skipped: (.skipped // null)}' body.json || true
          [ "$code" = "200" ] && jq -e '.ok == true' body.json >/dev/null
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    steps:
      - name: Keep schedule from pausing after 60 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/tick.yml/enable
